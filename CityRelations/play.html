<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>City Relations</title>
  <!-- Leaflet Stuff -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <!-- My Stuff-->
  <link rel="stylesheet" href="style.css" />
  <script src="script.js"></script>
</head>
<body onload="setup();">
  <main>
    <h1>Which of these two cities is further <span id="direction"></span>?</h1>
    <div id="map-arranger">
      <div class="map-holder">
        <h2 id="city1-name">City1 Name</h2>
        <div id="city1" class="city-map"></div>
        <button onclick="reveal(city1)">Pick</button>
      </div>
      <div class="map-holder">
        <h2 id="city2-name">City2 Name</h2>
        <div id="city2" class="city-map"></div>
        <button onclick="reveal(city2)">Pick</button>
      </div>
    </div>
  </main>
  <div class="modal-backdrop" id="answer">
    <div>
      <h1 id="answer-header"></h1>
      <h2>The correct answer is <span id="right-city"></span></h2>
      <div id="answer-map" class="city-map"></div>
      <button onclick="setup()">Play Again</button>
      <a class="button" href="index.html">Return to Menu</a>
    </div>
  </div>
</body>
</html>
